build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  active: true
  LongMethod:
    threshold: 200
  LargeClass:
    threshold: 600
  CyclomaticComplexMethod:
    threshold: 25
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 10

naming:
  active: true
  FunctionNaming:
    functionPattern: '([a-zA-Z][a-zA-Z0-9]*)|([A-Z][a-zA-Z0-9]*)' # Allow Composable PascalCase functions
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true

style:
  active: true
  MagicNumber:
    active: false # Color codes and UI dp sizes in Compose
  WildcardImport:
    active: false # Standard in Compose layouts and tests
  MaxLineLength:
    maxLineLength: 200
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
    excludeRawStrings: true
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected)'
